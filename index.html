<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Breeze</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-live="polite">
        <header class="card-header">
          <div class="header-top">
            <p class="tag">today</p>
            <button
              id="theme-toggle"
              class="theme-toggle"
              type="button"
              aria-pressed="false"
              aria-label="Toggle color theme"
            >
              <span class="theme-toggle-thumb" aria-hidden="true"></span>
              <span class="theme-toggle-text">Light</span>
            </button>
          </div>
          <h1>Todo Breeze</h1>
          <p class="subtitle">Drop a task, clear your day.</p>
        </header>
        <form id="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">Add a todo</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="Sketch UI flow, ship feature, call Alex..."
            minlength="1"
            required
          />
          <button type="submit">Add</button>
        </form>
        <ul id="todo-list" aria-label="Todo items"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
